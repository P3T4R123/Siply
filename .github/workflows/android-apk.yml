name: Build Android APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf "%s" "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "Missing app/google-services.json or GOOGLE_SERVICES_JSON secret"
            exit 1
          fi

      - name: Prepare signing key
        shell: bash
        env:
          SIPLY_KEYSTORE_BASE64: ${{ secrets.SIPLY_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIPLY_KEYSTORE_BASE64"
          printf "%s" "$SIPLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/siply-release.p12"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build signed APK
        env:
          SIPLY_KEYSTORE_PATH: ${{ runner.temp }}/siply-release.p12
          SIPLY_KEYSTORE_PASSWORD: ${{ secrets.SIPLY_KEYSTORE_PASSWORD }}
          SIPLY_KEY_ALIAS: ${{ secrets.SIPLY_KEY_ALIAS }}
          SIPLY_KEY_PASSWORD: ${{ secrets.SIPLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: siply-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
